<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH Proxy Modern</title>
<!-- Google Fonts + Tailwind CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
<style>
    body { background-color: #f9fafb; }
    .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-sans">
    <div class="container text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">GH Proxy Modern</h1>
        <p class="text-gray-600 mb-6">在这里快速访问 GitHub 文件、Release 和 Gist，无需跨域烦恼。</p>

        <!-- 搜索栏 -->
        <form id="proxyForm" class="flex gap-2">
            <input id="repoInput" type="text" placeholder="输入 GitHub 文件或仓库 URL" 
                   class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">访问</button>
        </form>

        <div class="mt-6 text-gray-500 text-sm">
            示例 URL：<br>
            <code>https://github.com/user/repo/blob/main/file.js</code><br>
            <code>https://github.com/user/repo/releases/latest</code>
        </div>

        <div class="mt-8 flex justify-center gap-4">
            <a href="https://github.com/yourusername/my-gh-proxy" target="_blank" class="text-blue-500 hover:underline">源码</a>
            <a href="https://github.com/" target="_blank" class="text-gray-500 hover:underline">GitHub</a>
        </div>
    </div>

<script>
    const form = document.getElementById('proxyForm');
    const input = document.getElementById('repoInput');
    const PREFIX = '/gh/'; // Worker 路径前缀

    form.addEventListener('submit', e => {
        e.preventDefault();
        let url = input.value.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        // 跳转到 Worker 代理路径
        window.location.href = PREFIX + url;
    });
</script>
</body>
</html>
